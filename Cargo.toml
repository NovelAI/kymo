[workspace]
members = ["kymo-server", "kymo-frontend"]
resolver = "2"

# Upstream's router macro writes a bare `?` for an empty query; the fork tag is v0.7.9 plus DioxusLabs/dioxus#5845, which upstream merged for 0.8 (no 0.7 release has it), plus a fix for the `unreachable_code` warning Rust 1.100 raises at every derive with a String segment (not upstream). Drop this once a stable release carries both.
[patch.crates-io]
dioxus-router-macro = { git = "https://github.com/ad8e/dioxus", tag = "kymo-v0.7.9-2" }
