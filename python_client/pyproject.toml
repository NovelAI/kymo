[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kymo"
version = "0.0.0"
description = "Experiment tracker for machine learning"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # These floors are the versions the committed stubs (generated by the grpcio-tools pin below) require at import; test_generate_proto checks they match.
    "grpcio>=1.84.0,<2",
    "protobuf>=7.35.1",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    # Image accepts NumPy arrays, so this is runtime rather than test-only.
    "numpy>=1.24.0",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/NovelAI/kymo"
Issues = "https://github.com/NovelAI/kymo/issues"
Releases = "https://github.com/NovelAI/kymo/tags"

[project.scripts]
kymo-sync = "kymo.sync:main"

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.84.0",
    "ruff==0.15.2",
]
# A release build stamps its version here and above (scripts/set_version.py).
local = ["kymo-local-runtime==0.0.0"]

[tool.ruff]
extend-exclude = ["kymo/_generated"]

[tool.ruff.lint.per-file-ignores]
"kymo/__init__.py" = ["E402"]  # capture must install before public imports
