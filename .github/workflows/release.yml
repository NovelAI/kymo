name: release

# Every push to main (an exported snapshot) is built, tested, and gated. A commit with a Kymo-Release: YYYY.M.D trailer, which the export pushes already tagged vYYYY.M.D, is also stamped with that version and published to TestPyPI, then PyPI. A manual run is CI only.
# Any job step can write cache entries, so a release builds what it publishes without caches, and each build job uploads its artifact before running anything else.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer snapshot's CI cancels an older one's; a release, a re-run, or a manual run gets its own group, so nothing cancels it and it never waits.
concurrency:
  group: release-${{ github.event_name == 'push' && github.run_attempt == 1 && !contains(github.event.head_commit.message, 'Kymo-Release:') && 'snapshot' || github.run_id }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.meta.outputs.release }}
      platforms: ${{ steps.meta.outputs.platforms }}
    steps:
      - id: meta
        env:
          PRIVATE: ${{ github.event.repository.private }}
          # Only a push has a head commit, so a manual run never publishes and cannot race a release's uploads.
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          release=$(git interpret-trailers --parse <<<"$MESSAGE" | sed -n 's/^Kymo-Release: *//p')
          echo "release=$release" >> "$GITHUB_OUTPUT"
          platforms='{"platform":"linux-x86_64","runner":"ubuntu-latest"}'
          # macOS runners are free only in public repos, and a release needs both wheels.
          if [ "$PRIVATE" = false ]; then
            platforms+=',{"platform":"macos-arm64","runner":"macos-15"}'
          elif [ -n "$release" ]; then
            echo "::error::release from the public repo: a private repo builds no macOS wheel"
            exit 1
          fi
          echo "platforms=[$platforms]" >> "$GITHUB_OUTPUT"

  ci:
    name: ci (${{ matrix.section }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {section: root, workspace: .}
          - {section: wasm, workspace: .}
          - {section: local-runtime, workspace: local-runtime}
          - {section: qualification, workspace: tools/local-transport-qualification}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.section }}
          workspaces: ${{ matrix.workspace }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: scripts/ci.sh ${{ matrix.section }}

  frontend:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.9
      # rust-cache finds only a target dir inside the workspace.
      - if: needs.meta.outputs.release == ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> frontend-build/target
      - run: scripts/build.sh frontend frontend-build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: frontend-build/public
          if-no-files-found: error

  # Both wheels ship the same notices, so one job builds them.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: scripts/build.sh notices
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: local-runtime/THIRD-PARTY-NOTICES
          if-no-files-found: error

  client:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - &set-version
        if: needs.meta.outputs.release != ''
        env:
          VERSION: ${{ needs.meta.outputs.release }}
        run: scripts/set_version.py "$VERSION"
      - run: python -m pip install build
      - run: python -m build --outdir dist python_client
      - uses: actions/upload-artifact@v7
        with:
          name: dist-client
          path: dist
          if-no-files-found: error
      - run: python -m pip install twine
      - run: python scripts/check_artifacts.py dist
      - run: scripts/ci.sh client

  runtime:
    needs: [meta, frontend, notices, client]
    name: runtime (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.meta.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    env:
      KYMO_FRONTEND_BUNDLE_DIR: ${{ github.workspace }}/local-runtime/.frontend-bundle
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: ${{ env.KYMO_FRONTEND_BUNDLE_DIR }}
      - uses: actions/download-artifact@v8
        with:
          name: dist-client
          path: dist-client
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: local-runtime
      - *set-version
      # manylinux and docker-options apply only to the Linux container build.
      - uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        with:
          command: build
          args: --locked --release --compatibility pypi --out dist
          sccache: ${{ needs.meta.outputs.release == '' }}
          manylinux: '2_28'
          maturin-version: v1.14.1
          working-directory: local-runtime
          docker-options: -e KYMO_FRONTEND_BUNDLE_DIR
      - uses: actions/upload-artifact@v7
        with:
          name: dist-runtime-${{ matrix.platform }}
          path: local-runtime/dist
          if-no-files-found: error
      # On macOS this installs pip from PyPI, so it runs after the upload.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install twine
      - run: python scripts/check_artifacts.py local-runtime/dist
      - run: scripts/smoke.sh local-runtime/dist dist-client

  # macOS arm64 end-to-end qualification of a wheel built with the CI-only test-idle-timeout feature, which is never uploaded, so it cannot be published. The internal CI runs the same phases on Linux x86-64.
  runtime-qualification:
    needs: frontend
    # macOS runners are free only in public repos.
    if: github.event.repository.private == false
    name: runtime qualification (macos-arm64)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      KYMO_FRONTEND_BUNDLE_DIR: ${{ github.workspace }}/local-runtime/.frontend-bundle
    steps:
      # The runner context is not available in a job-level env.
      - run: echo "KYMO_LOCAL_ROOT=$RUNNER_TEMP/kymo-local-runtime" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: ${{ env.KYMO_FRONTEND_BUNDLE_DIR }}
      - run: python -m pip install 'maturin==1.14.1'
      # Built like the shipped macOS wheel, plus the CI-only feature.
      - working-directory: local-runtime
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: maturin build --locked --release --features test-idle-timeout --compatibility pypi --out dist
      - run: python -m pip install local-runtime/dist/*.whl ./python_client playwright==1.61.0
      - run: python -m playwright install chromium
      - run: python tools/local-transport-qualification/runtime_qualification.py install
      - run: python tools/local-transport-qualification/runtime_qualification.py open-hold
      - run: python tools/local-transport-qualification/runtime_qualification.py recovery
      - run: python tools/local-transport-qualification/runtime_qualification.py integration
      - run: python tools/local-transport-qualification/runtime_qualification.py seed
      - run: python tools/local-transport-qualification/runtime_qualification.py browser

  # The internal CI qualifies the transports on Linux x86-64.
  transport-qualification:
    if: github.event.repository.private == false
    name: transport qualification (macos-arm64)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/local-transport-qualification
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.36
      - run: python -m pip install 'grpcio>=1.81.0,<2' 'httpx>=0.27.0'
      - run: python download_clickhouse.py --output "$RUNNER_TEMP/clickhouse"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --locked -- --clickhouse-binary "$RUNNER_TEMP/clickhouse" --python "$(command -v python)" --state-dir "$RUNNER_TEMP/m2q"

  # One job per project and index: a pending publisher is unique per workflow and environment, so each new project needs its own environment.
  testpypi:
    needs: [meta, ci, runtime, runtime-qualification, transport-qualification]
    if: needs.meta.outputs.release != ''
    name: testpypi (${{ matrix.project }})
    strategy: &publish-strategy
      # Let the other project's upload finish if one fails.
      fail-fast: false
      matrix:
        include:
          - {project: kymo, environment: pypi, artifacts: dist-client}
          - {project: kymo-local-runtime, environment: pypi-local-runtime, artifacts: dist-runtime-*}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - &download-dists
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.artifacts }}
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # No publish credential here: this job installs from TestPyPI, where anyone can claim unused names.
  testpypi-install:
    needs: [meta, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install kymo[local] from TestPyPI
        env:
          VERSION: ${{ needs.meta.outputs.release }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          pip="$RUNNER_TEMP/venv/bin/pip"
          # Only kymo's two distributions come from TestPyPI (retrying while its index catches up); their dependencies resolve from PyPI.
          for attempt in 1 2 3 4 5 6; do
            "$pip" install --index-url https://test.pypi.org/simple/ --no-deps "kymo==$VERSION" "kymo-local-runtime==$VERSION" && break
            [ "$attempt" = 6 ] && exit 1
            sleep 30
          done
          "$pip" install "kymo[local]==$VERSION"
          "$RUNNER_TEMP/venv/bin/kymo" --version

  pypi:
    needs: [meta, testpypi-install]
    name: pypi (${{ matrix.project }})
    strategy: *publish-strategy
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - *download-dists
      - uses: pypa/gh-action-pypi-publish@release/v1
