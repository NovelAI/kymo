[package]
name = "kymo-local-runtime-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/NovelAI/kymo"
publish = false

[dependencies]
anyhow = "1"
directories = "6"
libc = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
