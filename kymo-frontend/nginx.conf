# Dashboard identifiers may equal real build paths such as `assets`. Browser
# document requests must reach the SPA before filesystem lookup; subresource
# requests still resolve immutable build assets normally.
map $http_accept $kymo_request_path {
    # volatile: map results are cached per request, and `default $uri` must
    # re-evaluate after try_files' internal redirect to /index.html — the
    # cached original URI otherwise loops the fallback into a 500
    # "internal redirection cycle" for non-HTML clients (curl, probes).
    volatile;
    default $uri;
    ~*text/html /index.html;
}

# Only a content-hashed build asset (dx names them `<stem>-dxh<hex>.<ext>`) is cached for good; the SPA document revalidates so a deploy lands on the next load. Keyed on the served path, which add_header reads after any fallback to index.html.
map $kymo_request_path $kymo_cache_control {
    ~^/assets/[^/]+-dxh[0-9a-f]+\.[^/]+$ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    # The image build stores a `gzip -9` copy beside each wasm, js, css and ttf asset.
    gzip_static on;
    # Also behind proxies, which add Via (gzip_proxied defaults to off) or, like a stock proxy_pass, speak HTTP/1.0 (gzip_http_version defaults to 1.1).
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_vary on;
    add_header Cache-Control $kymo_cache_control;

    location / {
        try_files $kymo_request_path $kymo_request_path/ /index.html;
    }
}
