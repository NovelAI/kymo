# Dashboard identifiers may equal real build paths such as `assets`. Browser
# document requests must reach the SPA before filesystem lookup; subresource
# requests still resolve immutable build assets normally.
map $http_accept $kymo_request_path {
    # volatile: map results are cached per request, and `default $uri` must
    # re-evaluate after try_files' internal redirect to /index.html — the
    # cached original URI otherwise loops the fallback into a 500
    # "internal redirection cycle" for non-HTML clients (curl, probes).
    volatile;
    default $uri;
    ~*text/html /index.html;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $kymo_request_path $kymo_request_path/ /index.html;
    }
}
