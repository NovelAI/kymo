[package]
name = "kymo-frontend"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NovelAI/kymo"
publish = false

[features]
local-runtime = []

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["AbortSignal", "CssStyleDeclaration", "Document", "Element", "HtmlElement", "HtmlInputElement", "Node", "Window", "Storage", "StorageEvent", "Performance", "ResizeObserver", "ResizeObserverEntry", "DomRect", "DomRectReadOnly", "HtmlDialogElement", "ToggleEvent", "Event", "EventTarget", "MouseEvent", "Navigator", "Selection", "Location", "Range", "DomRectList", "DragEvent", "DataTransfer", "MediaQueryList"] }
wasm-bindgen = "0.2"
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["sync"] }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "websocket"] }
wasm-bindgen-futures = "0.4"

[build-dependencies]
tonic-prost-build = "0.14"
